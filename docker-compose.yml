services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: quicksketch_user
      POSTGRES_PASSWORD: LePassword1
      POSTGRES_DB: quicksketch
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/quicksketch
      - SPRING_DATASOURCE_USERNAME=quicksketch_user
      - SPRING_DATASOURCE_PASSWORD=LePassword1
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_KEY=Dock3rKeYv3ryL0nGcr45y80m80C1447
      - FRONTEND_URL=http://localhost:4200
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend