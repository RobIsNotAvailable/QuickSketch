<div class="auth-card">
  <h2>Log In to QuickSketch</h2>

  @if (errorMessage())
  {
    <div class="error-alert">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-field-structure">
      <input
        type="text"
        id="key"
        name="key"
        [(ngModel)]="credentials.key"
        required
        placeholder=" "
      />
      <label for="key">Username/Email</label>
    </div>

    <div class="form-field-structure">
      <div class="input-wrapper">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          placeholder=" "
        />
        <label for="password">Password</label>
        <button type="button" class="toggle-password" (click)="toggleShowPassword()">
          <i [class]="showPassword() ? 'bx bx-show' : 'bx bx-hide'"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-black">Log In</button>
  </form>

  <div class="footer-section">
    <span>Don't have an account?</span>
    <a routerLink="/register" class="btn-link">Sign Up</a>
  </div>
</div>
